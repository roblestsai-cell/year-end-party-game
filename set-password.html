<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">

<script id="landing-capture">(()=>{let value={hash:location.hash,search:location.search,pageUrl:location.origin+location.pathname,framed:window.top!==window.self};try{history.replaceState(null,'',location.pathname);}catch{value={failed:true};}Object.defineProperty(window,'__partyPasswordLanding',{configurable:true,value:{take(){const result=value;value=null;return result;}}});})();

<title>設定帳號密碼 | 尾牙遊戲</title>
<link rel="stylesheet" href="./set-password.css">
<script type="module" src="./set-password-page.js"></script>
</head>
<body><main>
<p class="eyebrow">尾牙遊戲 · 安全設定</p>
<h1>設定帳號密碼</h1>
<p class="muted">請使用您收到的邀請或重設密碼連結。此頁只設定該帳號的密碼，不會授予遊戲主持權限。</p>
<p id="status" role="status" aria-live="polite">正在驗證邀請連結…</p>
<form id="passwordForm" hidden>
<label for="newPassword">新密碼</label>
<input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="72" required disabled>
<label for="confirmPassword">再次輸入新密碼</label>
<input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="72" required disabled>
<p class="muted">至少 12 個字元。請使用未在其他網站使用的密碼；較長的密碼片語也很好。</p>
<label class="consent"><input id="consent" type="checkbox" required disabled><span>我確認要更新此帳號密碼，並同意將輸入的密碼透過 HTTPS 傳送至本活動的 Supabase 驗證服務。此頁不會把密碼或登入憑證存入瀏覽器儲存空間。</span></label>
<p class="destination">接收站點：qujufxbnciniiauvhfun.supabase.co/auth/v1/user</p>
<button id="savePassword" type="submit" disabled>設定密碼</button>
</form>
<a id="backToLogin" href="https://roblestsai-cell.github.io/year-end-party-game/">返回活動網站</a>
<footer class="muted">請勿把邀請連結或密碼分享給他人，也不需要把密碼傳給活動管理者。</footer>
<noscript><p>此頁需要 JavaScript 才能安全驗證連結。請勿在其他表單輸入這個密碼。</p></noscript>
</main></body></html>
