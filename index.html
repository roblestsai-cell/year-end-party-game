<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>尾牙猜歌王</title><style>
*{box-sizing:border-box}body{font-family:system-ui,'Microsoft JhengHei';background:#0e1528;color:white;margin:0}main{max-width:800px;margin:auto;padding:20px}h1{text-align:center;font-size:36px}.card{background:#1c2945;border-radius:18px;padding:20px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}button,input,select{font:inherit;border-radius:10px;padding:13px;margin:5px 0;border:0}button{background:#7864ed;color:white;font-weight:bold;cursor:pointer}input,select{background:#0e172e;color:white;border:1px solid #50617c;width:100%}.hidden{display:none}.muted{color:#bac6df}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choices button{min-height:65px}.danger{background:#a53858}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #46536c;text-align:left;padding:8px}audio{width:100%}#qr{background:white;padding:12px;width:max-content;max-width:100%}#qr img{max-width:180px}code{overflow-wrap:anywhere}@media(max-width:500px){.choices{grid-template-columns:1fr}button{min-height:45px}}
</style><main><h1>🎤 尾牙猜歌王</h1><p style="text-align:center" class="muted">國語 × 台語｜每輪隨機 10 題｜每題 30 秒</p>
<section id="login" class="grid"><div class="card"><h2>🎛 主持人登入</h2><input id="pin" type="password" placeholder="管理密碼"><button onclick="hostLogin()">登入控制台</button></div><div class="card"><h2>📱 挑戰者登入</h2><input id="name" placeholder="姓名"><input id="code" placeholder="員工識別碼"><button onclick="join()">加入比賽</button></div></section>
<section id="host" class="hidden"><div class="card"><h2>主持人控制台</h2><p>挑戰者掃碼加入（同一個區域網路）：</p><div id="qr"></div><p id="url"></p><div class="grid"><button onclick="act('next-round')">第一輪：猜歌（10題）</button><button onclick="act('next-photo-round')">第二輪：你在看什麼？（5張視覺陷阱）</button><button onclick="act('show-photo')">📸 顯示照片 10 秒</button><button onclick="act('open-photo-answer')">開放照片題作答 30 秒</button><button onclick="act('start-question')">▶ 播放並開放作答</button><button onclick="act('reveal')">公布答案／停止作答</button><button onclick="act('finish')">結算前五名</button></div><p id="stats"></p><div id="hq"></div><div id="photoFrame" style="display:none;text-align:center;background:#080b12;border-radius:14px;padding:10px"><img id="photoImg" style="max-width:100%;max-height:68vh;object-fit:contain" alt="記憶照片"><p id="photoCredit" class="muted"></p><button onclick="if(document.fullscreenElement)document.exitFullscreen();else document.getElementById('photoFrame').requestFullscreen()">照片全螢幕／返回</button></div><audio controls id="audio"></audio><p class="muted">音樂僅在主持人電腦播放；請先把合法使用的 MP3 放入 audio 資料夾。</p></div><div class="card"><h2>排行榜</h2><div id="rank"></div></div><div class="card"><h2>🎁 機會 or 命運</h2><div id="final"></div><div id="draws"></div><p id="remaining"></p><h3>新增獎項</h3><input id="prize" placeholder="獎項名稱（不顯示金額）"><select id="pool"><option>機會</option><option>命運</option></select><input id="qty" type="number" value="1" min="1" max="100"><button onclick="act('add-prize',{name:val('prize'),pool:val('pool'),quantity:Number(val('qty'))})">新增</button><button onclick="act('reset-prizes')">重置獎池（尚未抽獎時）</button></div><div class="card"><h2>活動管理</h2><p class="muted">重置整場會清除所有歷輪得獎資料，僅供重新舉辦活動。</p><button class="danger" onclick="if(confirm('確定清除全部活動紀錄？'))act('reset-event')">重置整場</button></div></section>
<section id="player" class="hidden"><div class="card"><h2 id="welcome"></h2><p id="status"></p><h2 id="timer"></h2><div id="pq"></div><div id="answer"></div><div id="feedback"></div></div><div class="card"><h2>本輪排行榜</h2><div id="prank"></div></div></section><p id="message" class="muted"></p></main><script>
let token=sessionStorage.getItem('token')||'',role=sessionStorage.getItem('role')||'',last='',state=null,loadedAudio='';const el=x=>document.getElementById(x),val=x=>el(x).value;function msg(x){el('message').textContent=x}function escapeHtml(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function post(path,data){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Token':token},body:JSON.stringify(data)}),j=await r.json();if(!r.ok)throw Error(j.error||'請稍後再試');return j}
async function hostLogin(){try{token=(await post('/api/host-login',{pin:val('pin')})).token;role='host';store();show();await refresh()}catch(e){msg(e.message)}}async function join(){try{token=(await post('/api/join',{name:val('name'),code:val('code')})).token;role='player';store();show();await refresh()}catch(e){msg(e.message)}}function store(){sessionStorage.setItem('token',token);sessionStorage.setItem('role',role)}
function show(){el('login').classList.add('hidden');el('host').classList.toggle('hidden',role!=='host');el('player').classList.toggle('hidden',role!=='player');if(role==='host'){let url=location.origin+'/?join=1';el('url').textContent=url;el('qr').innerHTML='<img alt="QR Code" src="/qr.png" />'}}
async function act(action,extra={}){try{let r=await post('/api/action',{action,...extra});if(action==='start-question')setTimeout(play,350);if(action==='reveal'||action==='finish')el('audio').pause();await refresh();if(r.result)alert('恭喜 '+r.result.name+' 獲得 '+r.result.prize)}catch(e){msg(e.message)}}
async function submit(answer){try{await post('/api/answer',{answer});await refresh()}catch(e){msg(e.message)}}
function board(rows){return '<table><tr><th>排名</th><th>姓名</th><th>分數</th></tr>'+rows.map((p,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(p.name)}</td><td>${p.score}</td></tr>`).join('')+'</table>'}
function play(){let a=el('audio');a.currentTime=0;a.play().catch(()=>msg('請按音樂播放器的播放鍵'))}
function render(s){state=s;let q=s.question,sec=Math.max(0,Math.ceil(s.deadline-s.server_time));if(role==='host'){
el('photoFrame').style.display=s.phase==='photo-show'&&s.photo?'block':'none';if(s.photo){el('photoImg').src=s.photo.url;el('photoCredit').textContent=s.photo.credit}el('stats').textContent=`${s.game_type==='photo'?'你在看什麼':'猜歌王'}｜第 ${s.round} 輪｜${s.phase}｜第 ${s.index}/${s.total} 題｜參賽 ${s.players} 人｜已作答 ${s.answered} 人｜剩餘 ${sec} 秒`;
el('hq').innerHTML=q?`<h3>${escapeHtml(q.prompt)}</h3><p>答案：${escapeHtml(q.answer)}</p>`:'<p>請先建立新一輪。</p>';
let src=q?.audio?'/audio/'+encodeURIComponent(q.audio):'';if(src!==loadedAudio){loadedAudio=src;el('audio').src=src}
el('rank').innerHTML=board(s.leaderboard||[]);let done=s.draws.filter(x=>x.round===s.round),next=s.finalists.find(x=>!done.some(y=>y.id===x.id));el('final').innerHTML=next?`<p>下一位：${escapeHtml(next.name)}</p><button id="chance">選擇機會</button><button id="fate">選擇命運</button>`:s.phase==='final'?'<p>本輪抽獎完成。</p>':'<p>完成本輪題目後開放前五名抽獎。</p>';if(next){el('chance').onclick=()=>act('draw',{code:next.id,pool:'機會'});el('fate').onclick=()=>act('draw',{code:next.id,pool:'命運'})}el('draws').innerHTML=done.map(x=>`<p>${escapeHtml(x.name)} → ${escapeHtml(x.pool)}：${escapeHtml(x.prize)}</p>`).join('');el('remaining').textContent=Object.entries(s.remaining).map(([k,v])=>`${k}剩餘 ${v} 份`).join('；');
}else{el('welcome').textContent='你好，'+(s.me?.name||'挑戰者');el('status').textContent=!s.me?.eligible?'你已在先前輪次得獎，不能再次參賽。':s.phase==='photo-show'?'請看主持人螢幕，記住照片內容！':s.phase==='photo-ready'?'照片已隱藏，等待主持人開放作答。':s.phase==='question'?'題目已開始，請立即作答！':s.phase==='reveal'?'本題結束，等待下一題。':s.phase==='final'?'本輪已結束，等待前五名抽獎。':'等待主持人開題';el('timer').textContent=s.phase==='question'?`⏱ ${sec} 秒`:'';el('pq').innerHTML=q?`<h3>第 ${s.index} 題</h3><p>${escapeHtml(q.prompt)}</p>`:'';let key=[s.round,s.index,s.phase,s.me?.answered].join(':');if(last!==key){last=key;el('answer').innerHTML='';if(s.phase==='question'&&s.me?.eligible&&!s.me?.answered&&q){if(q.type==='choice'){let div=document.createElement('div');div.className='choices';q.options.forEach(x=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>submit(x);div.append(b)});el('answer').append(div)}else{el('answer').innerHTML='<input id="textAnswer" placeholder="請輸入答案"><button id="send">送出</button>';el('send').onclick=()=>submit(val('textAnswer'))}}}el('feedback').textContent=s.me?.answered?'答案已送出':q?.answer?'正解：'+q.answer:'';el('prank').innerHTML=s.leaderboard.length?board(s.leaderboard):'<p>本輪結束後公布排行榜。</p>'}}
async function refresh(){if(!token)return;try{let r=await fetch('/api/state',{headers:{'X-Token':token},cache:'no-store'});render(await r.json())}catch(e){msg('伺服器暫時無法連線')}}if(role&&token){show();refresh()}setInterval(refresh,1000);
</script></html>
