<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>尾牙競賽・觀眾畫面</title><style>body{margin:0;background:#11162c;color:#fff;font:20px system-ui}main{max-width:900px;margin:auto;padding:20px}h1{color:#ffd777;font-size:30px}.choices{display:grid;gap:12px}button,select{font:inherit;padding:16px;border-radius:12px;background:#303858;color:white;border:1px solid #7580a4}button:disabled{opacity:.65}img{display:block;width:100%;max-height:65vh;object-fit:contain}#clock{font-size:40px;color:#ffd777}#result{color:#8fedb1}li{padding:4px}small{font-size:14px}</style><main><h1>尾牙競賽</h1><small>同一瀏覽器的獨立觀眾畫面，並非手機多人連線</small><p id="status">等待主持人連線…</p><div id="clock"></div><h2 id="question"></h2><div id="scene"></div><div id="answerArea" hidden><label>作答者 <select id="player"></select></label><div id="choices" class="choices"></div></div><p id="result"></p><h2>排行榜</h2><ol id="rank"></ol><div id="prizes"></div></main><script>
const $=id=>document.getElementById(id),channel=new BroadcastChannel(location.hash.slice(1));let current=null;
channel.onmessage=e=>{const s=e.data;if(s?.kind!=='projection')return;current=s;$('status').textContent=s.total?'第 '+s.round+' 輪・'+Math.min(s.index,s.total)+' / '+s.total:'等待開局';$('question').textContent=s.prompt;$('scene').replaceChildren();if(s.image){const img=document.createElement('img');img.src=s.image;img.alt='完整場景觀察圖片';$('scene').append(img);}$('answerArea').hidden=!s.options.length;const selected=$('player').value;$('player').replaceChildren();for(const p of s.players){const o=document.createElement('option');o.value=p.id;o.textContent=p.name+(p.answered?'・已答':'');$('player').append(o);}if(s.players.some(p=>p.id===selected))$('player').value=selected;renderChoices();$('result').textContent=s.answer?'正確答案：'+s.answer:'';$('rank').replaceChildren();for(const p of s.ranking){const li=document.createElement('li');li.textContent=p.name+'：'+p.score;$('rank').append(li);}$('prizes').textContent=s.draws.map(d=>d.name+'：'+d.prize).join('；');clock();};
function renderChoices(){const s=current;if(!s)return;$('choices').replaceChildren();const p=s.players.find(p=>p.id===$('player').value);for(const [i,o] of s.options.entries()){const b=document.createElement('button');b.textContent='ABCD'[i]+'　'+o;b.disabled=s.phase!=='answering'||Date.now()>=s.deadline||!p||p.answered;b.onclick=()=>{channel.postMessage({kind:'answer',questionId:s.questionId,playerId:p.id,answer:o});for(const btn of $('choices').children)btn.disabled=true;};$('choices').append(b);}}
function clock(){const s=current;if(!s)return;$('clock').textContent=['answering','photo-show'].includes(s.phase)?Math.max(0,Math.ceil((s.deadline-Date.now())/1000))+' 秒':'等待主持人';if(s.phase==='answering'&&Date.now()>=s.deadline)for(const b of $('choices').children)b.disabled=true;}
$('player').onchange=renderChoices;setInterval(clock,200);channel.postMessage({kind:'hello'});
</script></html>
