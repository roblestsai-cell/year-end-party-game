<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js; style-src 'self'; connect-src 'self' https://*.supabase.co; img-src 'self' data:; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"><title>尾牙猜歌 · 玩家</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="player-entry.css"></head>
<body><main><header><p class="eyebrow">尾牙猜歌 · 玩家入口候選</p><h1>輸入姓名加入</h1></header>
<p id="error" role="alert"></p><button id="restore" type="button" hidden>恢復本分頁連線</button>
<section id="join" hidden><form id="joinForm"><label>姓名<input id="name" autocomplete="nickname" maxlength="48" required></label><label>邀請碼<input id="invite" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="256" required></label><p id="inviteStatus" class="small"></p><button id="joinSubmit" type="submit">加入活動</button></form><p class="small">按下加入即將本次登入保留於這個分頁，重新整理可恢復。退出會清除，不保存密碼或邀請碼。請勿複製分頁。</p></section>
<section id="session" hidden><p id="connection" role="status"></p><p id="ticketPending" class="notice" role="status"></p><h2 id="phase"></h2><p id="timer" aria-live="off"></p><div id="choices" aria-label="當題選項" hidden></div><p id="answerStatus" role="status"></p>
<div id="pending" hidden><p>原操作結果尚未確認，已停止新操作，不會自動重送。</p><button id="reconcile" type="button">查詢原操作結果</button></div><button id="refresh" type="button">重新確認連線</button><button id="leave" type="button" class="secondary">退出</button></section>
<footer>只有主持人開放作答後才顯示選項。音訊由主持人播放；本頁不播放歌曲。<a href="index.html">返回舊主持入口</a></footer></main><script type="module" src="player.js"></script></body></html>
